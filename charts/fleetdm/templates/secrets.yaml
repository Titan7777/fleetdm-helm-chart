{{- if not .Values.fleet.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleetdm.fullname" . }}
  labels:
    {{- include "fleetdm.labels" . | nindent 4 }}
type: Opaque
data:
  server-private-key: {{ include "fleetdm.secretValue" (dict "ctx" $ "secret" (include "fleetdm.fullname" .) "key" "server-private-key" "value" .Values.fleet.privateKey "length" 32) }}
{{- end }}
{{- if not .Values.mysql.auth.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleetdm.mysql.fullname" . }}
  labels:
    {{- include "fleetdm.labels" . | nindent 4 }}
type: Opaque
data:
  mysql-password: {{ include "fleetdm.secretValue" (dict "ctx" $ "secret" (include "fleetdm.mysql.fullname" .) "key" "mysql-password" "value" .Values.mysql.auth.password "length" 24) }}
  {{- if .Values.mysql.enabled }}
  mysql-root-password: {{ include "fleetdm.secretValue" (dict "ctx" $ "secret" (include "fleetdm.mysql.fullname" .) "key" "mysql-root-password" "value" .Values.mysql.auth.rootPassword "length" 24) }}
  {{- end }}
{{- end }}
{{- if and .Values.fleet.tls.enabled (not .Values.fleet.tls.existingSecret) }}
{{- $name := include "fleetdm.tls.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "fleetdm.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{- if and $existing $existing.data }}
  ca.crt: {{ index $existing.data "ca.crt" }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
  {{- else }}
  {{- $svc := include "fleetdm.fullname" . }}
  {{- $dns := concat (list $svc (printf "%s.%s" $svc .Release.Namespace) (printf "%s.%s.svc" $svc .Release.Namespace) (printf "%s.%s.svc.cluster.local" $svc .Release.Namespace)) .Values.fleet.tls.selfSigned.dnsNames }}
  {{- $ca := genCA (printf "%s-ca" $svc) 3650 }}
  {{- $cert := genSignedCert $svc .Values.fleet.tls.selfSigned.ipAddresses $dns (int .Values.fleet.tls.selfSigned.validityDays) $ca }}
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  {{- end }}
{{- end }}
