{{- if .Values.networkPolicy.enabled }}
{{- range $component, $port := dict "mysql" 3306 "redis" 6379 }}
{{- if (index $.Values $component).enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fleetdm.fullname" $ }}-{{ $component }}
  labels:
    {{- include "fleetdm.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fleetdm.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "fleetdm.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: fleet
      ports:
        - port: {{ $port }}
{{- end }}
{{- end }}
{{- end }}
