apiVersion: v1
kind: Pod
metadata:
  name: {{ include "fleetdm.fullname" . }}-test-healthz
  labels:
    {{- include "fleetdm.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: healthz
      image: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
      command:
        - wget
        - --no-check-certificate
        - -qO-
        - {{ printf "%s://%s:%v/healthz" (ternary "https" "http" .Values.fleet.tls.enabled) (include "fleetdm.fullname" .) .Values.fleet.service.port }}
